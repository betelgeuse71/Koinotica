<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08090f">
<title>Koinotika</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Bosh sahifa -->
<section id="home" class="screen active">
  <canvas id="homeCanvas" class="bg-canvas"></canvas>
  <div class="home-inner">
    <h1>Koinotika</h1>
    <p id="homeHello" class="sub"></p>
    <button class="btn primary" id="btnPlay"></button>
    <div class="links"><button id="btnFree"></button><i></i><button id="btnHelp"></button></div>
  </div>
</section>

<!-- Vazifalar -->
<section id="missions" class="screen">
  <header class="bar"><button class="icon" data-back>‹</button><h2 id="missionsTitle"></h2></header>
  <div id="missionList" class="list"></div>
</section>

<!-- Angar -->
<section id="hangar" class="screen">
  <header class="bar"><button class="icon" data-back>‹</button>
    <div class="bar-text"><h2 id="hangarTitle"></h2><p id="hangarGoal"></p></div>
  </header>
  <canvas id="previewCanvas"></canvas>
  <div class="stats">
    <div><b id="stMass"></b><span id="lblMass"></span></div>
    <div><b id="stTwr"></b><span id="lblTwr"></span></div>
    <div><b id="stDv"></b><span id="lblDv"></span></div>
  </div>
  <p id="hangarHint" class="hint"></p>
  <nav id="tabs" class="tabs"></nav>
  <div id="options" class="options"></div>
  <div class="launch-row">
    <button class="pill" id="apToggle"></button>
    <button class="btn primary" id="btnToPad"></button>
  </div>
</section>

<!-- Parvoz -->
<section id="flight" class="screen">
  <canvas id="flightCanvas" class="bg-canvas"></canvas>
  <div class="hud">
    <button class="icon" id="btnAbort">✕</button>
    <div class="tele">
      <div class="tele-row">
        <div><span id="lblSpeed"></span><b id="hudSpeed">0</b></div>
        <div class="clock"><b id="hudClock">T− 00:00:00</b><div class="fuelbar"><i id="hudFuel"></i></div><span id="lblFuel"></span></div>
        <div><span id="lblAlt"></span><b id="hudAlt">0</b></div>
      </div>
      <small id="hudOrbit"></small>
    </div>
    <button class="icon" id="btnSound">♪</button>
  </div>
  <div id="count" class="count"></div>
  <div id="toast" class="toast"></div>
  <div class="controls">
    <div class="ctl-row">
      <button class="pill" id="btnAp"></button>
      <button class="pill" id="btnEngine"></button>
      <button class="pill" id="btnWarp"></button>
    </div>
    <div class="ctl-main">
      <button class="turn" id="btnLeft">‹</button>
      <button class="btn primary" id="btnMain"></button>
      <button class="turn" id="btnRight">›</button>
    </div>
  </div>
</section>

<div id="modal" class="modal"><div class="modal-card" id="modalCard"></div></div>

<script src="js/physics.js"></script>
<script src="js/text.js"></script>
<script src="js/sprites.js"></script>
<script src="js/draw.js"></script>
<script src="js/app.js"></script>
</body>
</html>
